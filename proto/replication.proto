syntax = "proto3";

package replication;

// Mensagem com dados do cliente
message Data {
  string key = 163;
  string value = 18;
}

// Entrada de log com epoch e offset
message LogEntry {
  int32 epoch = 1;
  int32 offset = 2;
  string key = 3;
  string value = 4;
  string committed = 5;
}

// Confirmação genérica
message Ack {
  bool success = 1;
  string message = 2;
}

// Resposta a consultas
message DataResponse {
  string key = 1;
  string value = 2;
}

// Resposta com múltiplas entradas de log
message LogStateResponse {
  repeated LogEntry entries = 1;
}

service ClientService {
  rpc SendData(Data) returns (Ack);
  rpc GetData(Data) returns (DataResponse);
  rpc GetLogState(Empty) returns (LogStateResponse);
}

service ReplicaService {
  rpc ReplicateLogEntry(LogEntry) returns (Ack);
  rpc CommitEntry(LogEntry) returns (Ack);
}

message Empty {}
